<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Game</title>
</head>

<div class="row">

    <div class="col-md-4">
       <div class="card p-4">
    <h4>Update Game</h4>
    <form method="POST" action="{% url 'update_game' game.id %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Game Name</label>
            {{ form.name }}
            <small class="text-danger">{{ form.name.errors }}</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Genre</label>
            {{ form.genre }}
            <small class="text-danger">{{ form.genre.errors }}</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Release Date</label>
            {{ form.release_date }}
            <small class="text-danger">{{ form.release_date.errors }}</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            {{ form.desc }}
            <small class="text-danger">{{ form.desc.errors }}</small>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" name="form_type" value="apply" class="btn btn-info">Apply Changes</button>
            <button type="submit" name="form_type" value="cancel" class="btn btn-secondary">Cancel</button>
            <button type="submit" name="form_type" value="delete" class="btn btn-danger">Delete Game</button>
        </div>
    </form>
</div>
    </div>





    </body>

</html>
