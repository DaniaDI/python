<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Gold - Setup Rules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card bg-secondary text-white p-4 shadow-lg border-0" style="width: 420px;">
        <h2 class="text-center mb-4"> Ninja Gold Game</h2>
        <p class="text-center text-light small mb-4">Specify your winning conditions before starting the game.</p>
        
        <form action="/process_money/setup/" method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="target_gold" class="form-label fw-bold"> Target Gold Goal:</label>
                <input type="number" id="target_gold" name="target_gold" class="form-control" value="100" min="10" required>
                <div class="form-text text-light opacity-75">How much gold do you need to collect to win?</div>
            </div>
            
            <div class="mb-4">
                <label for="max_moves" class="form-label fw-bold"> Maximum Allowed Moves:</label>
                <input type="number" id="max_moves" name="max_moves" class="form-control" value="10" min="1" required>
                <div class="form-text text-light opacity-75">In how many moves must you reach the goal?</div>
            </div>
            
            <button type="submit" class="btn btn-warning text-dark w-100 fw-bold py-2 shadow">Start Game</button>
        </form>
    </div>

</body>
</html>
