<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess Game</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 text-center">

    <h2 class="mb-4">Guess the Number </h2>

    <!-- Result Box -->
    {% if result %}
        <div class="alert 
            {% if result == 'Too Low' %}
                alert-warning w-100  
            {% elif result == 'Too High' %}
                alert-danger
            {% elif result == 'Correct!' %}
                alert-success
            {% else %}
                alert-secondary
            {% endif %}
            shadow">
            {{ result }}
        </div>
    {% endif %}

    <!-- Form -->
 {% if not game_over %}
    <form action="{% url 'guess' %}" method="post" class="mt-3">
        {% csrf_token %}
        <input type="number" name="num" class="form-control w-50 mx-auto mb-3" required>
        <button class="btn btn-primary">Submit</button>
    </form>
{% endif %}

{% if game_over and won %}
        <div class="card p-3 my-3 border-success shadow-sm">
            <h5 class="text-success">Congratulations!</h5>
            <p>Enter your name to join the leaderboard:</p>
            <form action="/save_score/" method="post">
                {% csrf_token %}
                <input type="text" name="player_name" class="form-control mb-2 text-center" placeholder="Your Name" required>
                <button class="btn btn-success w-100">Save my Score</button>
            </form>
        </div>
    {% endif %}

 <!-- Restart -->
 {% if game_over %}
   <p>Attempts: {{ attempts }} / 5 </p>
   <a href="/restart/" class="btn btn-dark mt-4">play Again</a>
 {% endif %}


</body>
</html>
