<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 text-center" style="max-width: 500px;">
    <h2 class="mb-4"> Winners Leaderboard</h2>

    {% if leaderboard %}
        <table class="table table-striped table-hover shadow-sm bg-white mt-3">
            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>Name</th>
                    <th>Attempts</th>
                </tr>
            </thead>
            <tbody>
                {% for player in leaderboard %}
                    <tr>
                        <td>{{ forloop.counter }}</td><!--ـعداد تلقائي في ديجينجو-->
                        <td><strong>{{ player.name }}</strong></td>
                        <td><span class="badge bg-success">{{ player.attempts }} Attempts</span></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-secondary mt-3">
            No winners yet! Be the first one. 
        </div>
    {% endif %}

    <div class="mt-4">
        <a href="/" class="btn btn-primary px-4">Back to Game</a>
    </div>
</div>

</body>
</html>
