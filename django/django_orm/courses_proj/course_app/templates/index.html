<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>course Management</title>
</head>

<body class="container mt-5">
    <form action="{% url 'course_index' %}" method="POST" class="row g-3">
        {% csrf_token %}
        <div class="col-md-5">
            <label for="name" class="form-label"> Course Name </label>
            <input type="text" class="form-control" name="name" id="name" required>
            <div class="text-danger small">{{ form.name.errors }}</div>
        </div>

        <div class="col-md-10">
            <label for="desc" class="form-label">Description</label>
            <textarea name="desc" id="desc" class="form-control" rows="4"></textarea>
            <div class="text-danger small">{{ form.desc.errors }}</div>

        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Course</button>
        </div>
    </form>

    <div class="table-section mt-5">
        <h2>All course</h2>
        <table class="table table-striped table-hover mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Name c</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for course in all_courses %}
                <tr>
                    <td>{{ course.id }}</td>
                    <td>{{ course.name}} </td>
                    <td>{{ course.course_desc.desc }}</td>
                    <td>
                        <a href="{%  url 'course_delete' course.id %}">Remove</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">No authors added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
