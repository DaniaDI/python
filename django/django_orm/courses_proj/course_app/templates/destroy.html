<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Delete a course</title>
</head>

<body class="container mt-5">
    <div class="card p-4 shadow" style="max-width: 550px; margin: auto;">

        <h4 class="mb-4">Are you sure you want to delete the following course?</h4>

        <table class="table table-borderless">
            <tr>
                <td><strong>Name:</strong></td>
                <td>{{ course.name }}</td>
            </tr>
            <tr>
                <td><strong>Description:</strong></td>
                <td>{{ course.course_desc.desc }}</td>
            </tr>
        </table>

        <form method="POST" action="{% url 'course_delete' course.id %}">
            {% csrf_token %}
            <!-- Yes → POST → يحذف -->
            <button type="submit" class="btn btn-danger">Yes! I want to delete this</button>
        </form>

        <!-- No → يرجع بدون حذف -->
        <a href="{% url 'course_index'  %}" class="btn btn-secondary mt-2">No</a>

    </div>
</body>

</html>
