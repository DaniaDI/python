<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Tv Shows</title>
</head>
<body>
    
<div class="table-section mt-5">
    <h2>All Shows</h2>
    <table class="table table-striped table-hover mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Network</th>
                <th>Release_Date</th>
                <th>Actions</th>

            </tr>
        </thead>
        <tbody>
            {% for show in all_shows %}
            <tr>
                <td>{{ show.id }}</td>
                <td>{{ show.title }}</td>
                <td>{{ show.network }}</td>
                <td>{{ show.release_date }}</td>
    
                <td>
                <a href="/shows/{{ show.id }}/" class="btn btn-sm btn-info">Show</a>
                <a href="/shows/{{ show.id }}/edit/" class="btn btn-sm btn-warning">Edit</a>
                
                <form action="{% url 'show_delete' id=show.id %}" method="POST" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
            </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No shows added yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'show_new' %}">Add new show</a>
</div>
</body>
</html>
