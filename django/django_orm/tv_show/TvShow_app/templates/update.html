<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>add show</title>
</head>
<body class="container mt-5">
    <form action="{% url 'show_update' id=show.id %}" method="POST" class="row g-3">
        
        {% csrf_token %}
        <div class="col-md-5">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" name="title" id="title" value="{{ show.title }}" required>
        </div>
           <div class="col-md-5">
            <label for="network" class="form-label">Network</label>
            <input type="text" class="form-control" name="network" id="network" required>
        </div>
        <div class="col-md-5">
            <label for="date" class="form-label">Release Date</label>
            <input type="date" class="form-control" name="date" id="date" required>
        </div>
        <div class="col-md-10">
            <label for="desc" class="form-label">Description</label>
            <textarea name="desc" id="desc" class="form-control" rows="4"></textarea>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Update</button>

            <a href="/shows/{{ show.id }}" class="btn btn-secondary">Go Back</a>
        </div>
    </form>

     <a href="/shows/" class="btn btn-info mt-5">Go to show</a>
</body>
</html>
