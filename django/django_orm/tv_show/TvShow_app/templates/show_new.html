<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>add show</title>
</head>
<body class="container mt-5">
    <form action="{% url 'show_create' %}" method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-5">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" name="title" id="title" required>
            <div class="text-danger">{{ form.title.errors }}</div>
        </div>
           <div class="col-md-5">
            <label for="network" class="form-label">Network</label>
            <input type="text" class="form-control" name="network" id="network" required>
            <div class="text-danger">{{ form.network.errors }}</div>
        </div>
        <div class="col-md-5">
            <label for="date" class="form-label">Release Date</label>
            <input type="date" class="form-control" name="release_date" id="date" required>
            <div class="text-danger">{{ form.release_date.errors }}</div>
        </div>
        <div class="col-md-10">
            <label for="desc" class="form-label">Description</label>
            <textarea name="desc" id="desc" class="form-control" rows="4"></textarea>
            <div class="text-danger">{{ form.desc.errors }}</div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Create</button>
        </div>
    </form>
    
</body>
</html>
