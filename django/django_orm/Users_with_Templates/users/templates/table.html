<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>user_table</title>
</head>
<body>
    <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Email</th>
      <th scope="col">Age</th>
    </tr>
  </thead>
  <tbody>
            {% for user in all_the_users %}
            <tr>
                <th scope="row">{{ user.id }}</th> 
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.age }}</td>
            </tr>
            <!-- {% empty %} -->
            <tr>
                <td colspan="4" class="text-center text-muted">No users found. Add one above!</td>
            </tr>
            {% endfor %}
            
        </tbody>

</table>

<a href="/" class="btn btn-secondary mt-3">Add Another User</a>
</body>
</html>
