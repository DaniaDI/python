<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>user-templates</title>
</head>
<body>
<form action ='/save/'  method="POST" class="row g-3">
  {% csrf_token %}
  <div class="col-md-5">
    <label for="f-name" class="form-label">f-Name</label>
    <input type="text" class="form-control" name='first_name' id="f-name">
  </div>
   <div class="col-md-5">
    <label for="l-name" class="form-label">l-Name</label>
    <input type="text" class="form-control" name='last_name' id="l-name">
  </div>
  <div class="col-md-5">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control"  name='email'id="email">
  </div>
  <div class="col-md-5">
    <label for="age" class="form-label">Age</label>
    <input type="number" class="form-control" name='age' id="age">
  </div>
 

  <div class="col-12">
    <button type="submit" class="btn btn-primary">save</button>
  </div>
</form>
</body>
</html>
