<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ninja Money</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
.contanier {
    display: flex;
    justify-content: space-between;
    padding: 22px;
}

.box {
    border: 1px solid black;
    padding: 20px;
    width: 22%;
    text-align: center;
}
.gold{
    text-align: center;
}
 .btn{
    margin-left:46%;
    margin-bottom: 22px;
}
.activite{
    margin-left: 22px;
}

</style>

</head>
<body>
      <h3 class="gold">Your Gold: {{ gold }}</h3>
    <div class="contanier">
     <div class="box">
        <h2>Farm</h2>
      
        <p>earns 10-20 gold </p>
    <form action="/process_money" method="post">
    <input type="hidden" name="building" value="farm" />
    <input type="submit" value="Find Gold!"/>
    </form>
     </div>
     <div class="box">
          <h2>Cave</h2>
        <p>earns 5-10 golds</p>
    <form action="/process_money" method="post">
    <input type="hidden" name="building" value="cave" />
    <input type="submit" value="Find Gold!"/>
    </form>
  </div>
<div class="box">
      <h2>House</h2>
      <p>earns 2-5 golds</p>
    <form action="/process_money" method="post">
    <input type="hidden" name="building" value="house" />
    <input type="submit" value="Find Gold!"/>
    </form>
</div>
<div class="box">
      <h2>Casino</h2>
      <p>earns 0-50 golds</p>
    <form action="/process_money" method="post">
    <input type="hidden" name="building" value="casino" />
    <input type="submit" value="Find Gold!"/>
    </form>
</div>

    </div>

    <a href="/restart" class="btn btn-dark mt-4">play Again</a>

    <div class="activite" style="height:200px; width:80%; overflow:auto; border:1px solid black; padding:10px;">
    <h3>Activities:</h3>

    {% for active in activities %}
        {{ active | safe }}
    {% endfor %}
    </div>

</body>
</html>
