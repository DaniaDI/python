<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess Game</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 text-center">

    <h2 class="mb-4">Guess the Number </h2>

    <!-- Result Box -->
    {% if result %}
        <div class="alert 
            {% if result == 'Too Low' %}
                alert-warning w-100  
            {% elif result == 'Too High' %}
                alert-danger
            {% elif result == 'Correct!' %}
                alert-success
            {% else %}
                alert-secondary
            {% endif %}
            shadow">
            {{ result }}
        </div>
    {% endif %}

    <!-- Form -->
    {% if game_over == False %}
    <form action="/guess" method="post" class="mt-3">
        <input type="number" name="num" class="form-control w-50 mx-auto mb-3" required>
        <button class="btn btn-primary">Submit</button>
    </form>
{% endif %}

 <!-- Restart -->
  {% if result == 'Correct!'  %}
   <p>Attempts: {{ attempts }} / 5 </p>
   <a href="/restart" class="btn btn-dark mt-4">play Again</a>
 {% endif %}

 {% if attempts >=5 %}
  <p>Attempts: {{ attempts }} / 5 </p>
  <a href="/restart" class="btn btn-dark mt-4">play Again</a>
   {% endif %}
</div>




</body>
</html>
