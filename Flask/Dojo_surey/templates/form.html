<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>form</title>
    <style>
       .box{
        margin:0 auto;
        width:500px;
        height:200px;
       }
       .Div{
        margin-bottom: 22px;
       }
    </style>
</head>

<body>

<div class="box">
    <form action="/result" method="POST">

        <div class="mb-3 mt-3">
            <label class="form-label">Your Name:</label>
            <input type="text" class=" form-control w-50" name="name" required>
        </div>
<div class="Div">
        <label class="form-label">Dojo location:</label>
        <select class=" form-select w-50" name="location">
            <option disabled  selected value="">choose:</option>
            <option value="San Jose">San Jose</option>
            <option value="Japan">Japan</option>
            <option value="Korea">Korea</option>
            <option value="China">China</option>
            <option value="Gaza">Gaza</option>
        </select>
</div>
<div class="Div">
        <label class="form-label">Favorite Language:</label>
        <select class=" form-select w-50" name="lang">
            <option disabled  selected value="">choose:</option>
            <option value="Python">Python</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="C++">C++</option>
        </select>
</div>
        <label class="form-label mt-3">Comments:</label>
        <textarea class="form-control w-50" rows="5" name="text"></textarea>

        <button type="submit" class="btn btn-primary mt-3 w-25">Submit</button>

    </form>



</div>
</body>

</html>
